<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root {
  --cream: #FAF5EE;
  --cream-dark: #EDE4D6;
  --green: #2D5A3D;
  --green-light: #3D7A55;
  --rose: #B5637A;
  --rose-light: #C9849A;
  --gold: #C9A84C;
  --text: #1B2B1E;
  --text-light: #6B7A6E;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body { font-family: 'Source Sans 3', sans-serif; background: var(--cream); color: var(--text); }

/* NAV */
nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--green);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.25rem; height: 58px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.nav-logo { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 1.1rem; font-weight: 600; }
.nav-right { display: flex; align-items: center; gap: 0.2rem; }
.nav-link {
  color: rgba(250,245,238,0.75); text-decoration: none;
  padding: 0.4rem 0.7rem; font-size: 0.8rem; letter-spacing: 0.06em;
  text-transform: uppercase; border-radius: 4px; transition: color 0.2s;
}
.nav-link:hover { color: var(--cream); }
.nav-link.hide-mobile { display: inline; }
.cart-btn {
  background: var(--rose); color: white; border: none;
  padding: 0.5rem 1rem; border-radius: 24px; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif; font-size: 0.85rem;
  display: flex; align-items: center; gap: 6px; margin-left: 0.4rem;
  transition: background 0.2s; min-height: 40px;
}
.cart-btn:hover { background: var(--rose-light); }
.cart-count {
  background: var(--gold); color: var(--green); font-weight: 700;
  width: 20px; height: 20px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 0.72rem;
}
.share-btn {
  background: rgba(255,255,255,0.15); color: var(--cream); border: none;
  padding: 0.45rem 0.9rem; border-radius: 24px; cursor: pointer;
  font-family: 'Source Sans 3', sans-serif; font-size: 0.82rem;
  display: flex; align-items: center; gap: 5px; transition: background 0.2s;
  min-height: 40px;
}
.share-btn:hover { background: rgba(255,255,255,0.25); }

/* HERO */
.hero {
  background: var(--green); padding: 3rem 1.5rem 4.5rem;
  text-align: center; position: relative; overflow: hidden;
}
.hero::after {
  content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
  background: var(--cream); clip-path: ellipse(55% 100% at 50% 100%);
}
.hero-logo { width: 130px; height: auto; border-radius: 10px; margin: 0 auto 1.25rem; display: block; }
.hero h1 { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 2.4rem; font-weight: 700; margin-bottom: 0.4rem; line-height: 1.2; }
.hero .tagline { color: var(--gold); letter-spacing: 0.2em; text-transform: uppercase; font-size: 0.75rem; margin-bottom: 1.75rem; }
.hero-cta {
  background: var(--rose); color: white; border: none;
  padding: 0.85rem 2.5rem; border-radius: 32px;
  font-family: 'Playfair Display', serif; font-size: 1rem; cursor: pointer;
  letter-spacing: 0.05em; transition: all 0.25s; display: inline-block;
  min-height: 48px;
}
.hero-cta:hover { background: var(--rose-light); transform: translateY(-2px); }

/* PRODUCTS */
.products-wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1rem; }
.cat-section { margin-bottom: 3rem; }
.cat-title {
  font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--green);
  padding-bottom: 0.45rem; border-bottom: 2px solid var(--gold);
  display: inline-block; margin-bottom: 1.25rem;
}
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }

/* PRODUCT CARD — restructured so overlay only covers top zone */
.product-card {
  background: white; border: 1px solid var(--cream-dark);
  border-radius: 14px; overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: transform 0.3s, box-shadow 0.3s;
  display: flex; flex-direction: column;
}
.product-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(45,90,61,0.14); }

/* TOP ZONE: color bar + name + info button */
.card-top {
  position: relative; cursor: default;
  padding: 1rem 1.1rem 0.8rem;
  border-bottom: 1px solid var(--cream-dark);
}
.card-bar { height: 6px; margin: -1rem -1.1rem 0.75rem; }
.card-cat { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-light); margin-bottom: 0.2rem; }
.card-name { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: var(--green); font-weight: 600; line-height: 1.3; padding-right: 2rem; }

/* Info icon */
.info-icon {
  position: absolute; top: 1rem; right: 0.9rem;
  background: var(--cream); border: 1.5px solid var(--cream-dark);
  width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
  font-size: 0.75rem; font-weight: 700; color: var(--green);
  display: flex; align-items: center; justify-content: center;
  transition: all 0.18s; z-index: 2; flex-shrink: 0;
  font-family: 'Source Sans 3', sans-serif;
}
.info-icon:hover { background: var(--green); color: white; border-color: var(--green); }

/* FLOATING POPOVER — completely detached from the card */
#infoPopover {
  position: fixed;
  z-index: 9999;
  width: 280px;
  background: rgba(22, 46, 30, 0.97);
  border: 1px solid rgba(201, 168, 76, 0.5);
  border-radius: 14px;
  padding: 1.1rem 1.2rem;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), 0 0 0 1px rgba(201,168,76,0.15), inset 0 1px 0 rgba(255,255,255,0.06);
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px) scale(0.97);
  transition: opacity 0.22s ease, transform 0.22s ease;
  backdrop-filter: blur(4px);
}
#infoPopover.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
}
/* Arrow pointing down toward the card */
#infoPopover::after {
  content: '';
  position: absolute;
  bottom: -7px; left: 50%; transform: translateX(-50%);
  width: 13px; height: 7px;
  background: rgba(22,46,30,0.97);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  border-left: 1px solid rgba(201,168,76,0.4);
  border-right: 1px solid rgba(201,168,76,0.4);
}
#infoPopover.arrow-up::after {
  bottom: auto; top: -7px;
  clip-path: polygon(50% 0, 100% 100%, 0 100%);
}
.pop-name { font-family: 'Playfair Display', serif; font-size: 0.95rem; font-weight: 600; color: var(--gold); margin-bottom: 0.5rem; line-height: 1.3; }
.pop-desc { font-size: 0.8rem; line-height: 1.62; color: rgba(255,255,255,0.88); margin-bottom: 0.75rem; }
.pop-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 0.32rem; }
.pop-benefits { font-size: 0.78rem; line-height: 1.74; color: rgba(255,255,255,0.8); white-space: pre-line; }

/* BOTTOM ZONE: size selector + price + button — always visible, never covered */
.card-bottom { padding: 0.9rem 1.1rem 1rem; flex: 1; display: flex; flex-direction: column; }
.size-sel { display: flex; gap: 0.3rem; margin-bottom: 0.85rem; flex-wrap: wrap; }
.size-btn {
  border: 1.5px solid var(--cream-dark); background: white;
  padding: 0.28rem 0.6rem; border-radius: 20px; font-size: 0.78rem;
  cursor: pointer; transition: all 0.18s; color: var(--text);
  font-family: 'Source Sans 3', sans-serif; min-height: 34px;
}
.size-btn.active, .size-btn:hover { border-color: var(--green); background: var(--green); color: white; }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
.card-price { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 600; color: var(--green); }
.add-btn {
  background: var(--rose); color: white; border: none;
  padding: 0.5rem 1.1rem; border-radius: 20px; cursor: pointer;
  font-size: 0.85rem; font-family: 'Source Sans 3', sans-serif;
  transition: background 0.18s; min-height: 40px;
}
.add-btn:hover { background: var(--rose-light); }
.add-btn:active { transform: scale(0.96); }

/* CART SIDEBAR */
.cart-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.42); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.cart-bg.open { opacity: 1; pointer-events: all; }
.cart-panel {
  position: fixed; right: -100%; top: 0; width: 400px; max-width: 100vw;
  height: 100vh; height: 100dvh; background: white; z-index: 201;
  transition: right 0.34s cubic-bezier(.4,0,.2,1);
  display: flex; flex-direction: column;
  box-shadow: -4px 0 24px rgba(0,0,0,0.14);
}
.cart-panel.open { right: 0; }
.cart-hdr {
  background: var(--green); color: var(--cream);
  padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
  font-family: 'Playfair Display', serif; font-size: 1.05rem; flex-shrink: 0;
}
.x-btn { background: none; border: none; color: var(--cream); font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 0.25rem 0.5rem; }
.cart-list { flex: 1; overflow-y: auto; padding: 0.75rem 1.1rem; -webkit-overflow-scrolling: touch; }
.c-item { display: flex; align-items: flex-start; gap: 0.8rem; padding: 0.65rem 0; border-bottom: 1px solid var(--cream-dark); }
.c-item-info { flex: 1; min-width: 0; }
.c-item-name { font-family: 'Playfair Display', serif; font-size: 0.9rem; color: var(--green); margin-bottom: 0.1rem; line-height: 1.3; }
.c-item-size { font-size: 0.76rem; color: var(--text-light); }
.c-item-price { font-weight: 600; color: var(--green); font-size: 0.9rem; white-space: nowrap; flex-shrink: 0; }
.qty-row { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.35rem; }
.qb {
  width: 28px; height: 28px; border: 1.5px solid var(--cream-dark);
  background: white; border-radius: 50%; cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; color: var(--green);
  font-weight: 700; transition: all 0.15s;
}
.qb:hover { border-color: var(--green); background: var(--green); color: white; }
.qn { font-size: 0.88rem; font-weight: 600; min-width: 18px; text-align: center; }
.rb { background: none; border: none; color: var(--rose); cursor: pointer; font-size: 1rem; padding: 0.25rem 0.4rem; }

.cart-ft { border-top: 1px solid var(--cream-dark); padding: 0.85rem 1.1rem; background: var(--cream); flex-shrink: 0; }
.tip-lbl { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-light); margin-bottom: 0.35rem; }
.tip-opts { display: flex; gap: 0.3rem; flex-wrap: wrap; }
.to {
  border: 1.5px solid var(--cream-dark); background: white;
  padding: 0.28rem 0.65rem; border-radius: 20px; font-size: 0.78rem;
  cursor: pointer; transition: all 0.18s; font-family: 'Source Sans 3', sans-serif;
  color: var(--text); min-height: 34px;
}
.to.on { border-color: var(--gold); background: var(--gold); color: white; font-weight: 600; }
.tip-custom { width: 80px; border: 1.5px solid var(--cream-dark); border-radius: 20px; padding: 0.28rem 0.65rem; font-size: 0.78rem; font-family: 'Source Sans 3',sans-serif; outline: none; margin-top: 0.4rem; }
.tip-custom:focus { border-color: var(--gold); }
.dep-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-top: 1px solid var(--cream-dark); margin-top: 0.5rem; }
.dep-info { flex: 1; min-width: 0; }
.dep-lbl { font-size: 0.82rem; font-weight: 600; color: var(--text); }
.dep-note { font-size: 0.72rem; color: var(--text-light); margin-top: 1px; }
.tgl { position: relative; width: 42px; height: 24px; cursor: pointer; flex-shrink: 0; }
.tgl input { opacity: 0; width: 0; height: 0; }
.tgl-sl { position: absolute; inset: 0; background: var(--cream-dark); border-radius: 24px; transition: 0.28s; }
.tgl-sl::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: 0.28s; }
.tgl input:checked + .tgl-sl { background: var(--green); }
.tgl input:checked + .tgl-sl::before { transform: translateX(18px); }
.s-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.86rem; margin-bottom: 0.42rem; }
.s-row.big { font-family: 'Playfair Display', serif; font-size: 1.08rem; font-weight: 600; color: var(--green); border-top: 1.5px solid var(--gold); padding-top: 0.45rem; margin-top: 0.3rem; }
.go-btn {
  width: 100%; background: var(--green); color: white; border: none;
  padding: 0.9rem; border-radius: 8px; font-family: 'Playfair Display', serif;
  font-size: 0.97rem; cursor: pointer; margin-top: 0.65rem;
  letter-spacing: 0.04em; transition: background 0.2s; min-height: 48px;
}
.go-btn:hover { background: var(--green-light); }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; display: none; align-items: flex-end; justify-content: center; padding: 0; }
.modal-bg.open { display: flex; }
.modal-box {
  background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 520px;
  max-height: 92vh; max-height: 92dvh; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.modal-hdr { background: var(--green); color: var(--cream); padding: 1.1rem 1.4rem; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center; font-family: 'Playfair Display', serif; font-size: 1.05rem; position: sticky; top: 0; }
.modal-body { padding: 1.25rem 1.4rem 2rem; }
.f-grp { margin-bottom: 0.85rem; }
.f-lbl { display: block; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--text-light); margin-bottom: 0.28rem; }
.f-inp { width: 100%; border: 1.5px solid var(--cream-dark); border-radius: 8px; padding: 0.65rem 0.9rem; font-family: 'Source Sans 3', sans-serif; font-size: 1rem; outline: none; transition: border-color 0.2s; background: white; color: var(--text); -webkit-appearance: none; }
.f-inp:focus { border-color: var(--green); }
.sum-box { background: var(--cream); border-radius: 8px; padding: 1rem; margin: 0.85rem 0; font-size: 0.87rem; }
.sum-row { display: flex; justify-content: space-between; margin-bottom: 0.28rem; }
.sum-total { display: flex; justify-content: space-between; font-weight: 700; color: var(--green); font-family: 'Playfair Display', serif; font-size: 1rem; border-top: 1.5px solid var(--gold); padding-top: 0.45rem; margin-top: 0.45rem; }
.place-btn { width: 100%; background: var(--rose); color: white; border: none; padding: 1rem; border-radius: 8px; font-family: 'Playfair Display', serif; font-size: 1rem; cursor: pointer; letter-spacing: 0.05em; transition: background 0.2s; margin-top: 0.5rem; min-height: 52px; }
.place-btn:hover { background: var(--rose-light); }
.ok-screen { text-align: center; padding: 2.5rem 1.5rem; }
.ok-screen .ok-icon { font-size: 3rem; margin-bottom: 1rem; }
.ok-screen h2 { font-family: 'Playfair Display', serif; color: var(--green); margin-bottom: 0.5rem; }
.ok-screen p { color: var(--text-light); font-size: 0.9rem; line-height: 1.65; }

/* REVIEWS */
.reviews-section { background: var(--green); padding: 3rem 1rem; }
.reviews-inner { max-width: 1100px; margin: 0 auto; }
.reviews-section .cat-title { color: var(--cream); border-bottom-color: var(--gold); }
.rev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; margin: 1.25rem 0 2.25rem; }
.rev-card { background: rgba(255,255,255,0.07); border: 1px solid rgba(201,168,76,0.28); border-radius: 10px; padding: 1.1rem; }
.rev-stars { color: var(--gold); font-size: 1rem; margin-bottom: 0.4rem; }
.rev-text { color: rgba(255,255,255,0.84); font-size: 0.87rem; line-height: 1.65; margin-bottom: 0.65rem; font-style: italic; }
.rev-name { color: var(--gold); font-size: 0.8rem; font-weight: 600; }
.rev-date { color: rgba(255,255,255,0.4); font-size: 0.72rem; }
.rev-form { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 12px; padding: 1.25rem; max-width: 480px; }
.rev-form .f-lbl { color: rgba(255,255,255,0.68); }
.rev-form .f-inp { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.18); color: white; font-size: 0.95rem; }
.rev-form .f-inp::placeholder { color: rgba(255,255,255,0.38); }
.rev-form .f-inp:focus { border-color: var(--gold); }
.star-row { display: flex; gap: 0.25rem; margin-bottom: 0.85rem; }
.star-b { background: none; border: none; font-size: 1.6rem; cursor: pointer; color: rgba(255,255,255,0.28); transition: color 0.14s; padding: 0; line-height: 1; min-width: 36px; min-height: 36px; display: flex; align-items: center; justify-content: center; }
.star-b.on { color: var(--gold); }
.post-btn { background: var(--rose); color: white; border: none; padding: 0.72rem 1.8rem; border-radius: 8px; font-family: 'Playfair Display', serif; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; margin-top: 0.5rem; min-height: 46px; }
.post-btn:hover { background: var(--rose-light); }

/* PAYMENT METHODS */
.pay-section-lbl {
  font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em;
  color: var(--text-light); margin-bottom: 0.6rem; font-weight: 600;
}
#sq-apple-pay, #sq-google-pay { margin-bottom: 0.6rem; }
.pay-divider {
  display: flex; align-items: center; gap: 0.75rem;
  margin: 0.6rem 0 1rem; color: var(--text-light); font-size: 0.8rem;
}
.pay-divider::before, .pay-divider::after { content: ''; flex: 1; height: 1px; background: var(--cream-dark); }
#sq-card-container {
  border: 1.5px solid var(--cream-dark); border-radius: 10px;
  padding: 0.85rem 1rem; background: white; min-height: 44px;
}
.card-pay-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; background: var(--green); color: white; border: none;
  border-radius: 10px; padding: 0.9rem 1rem; font-size: 1rem;
  font-family: 'Playfair Display', serif; font-weight: 600; cursor: pointer;
  min-height: 52px; transition: background 0.18s; margin-top: 0.75rem;
}
.card-pay-btn:hover { background: var(--green-light); }
.pay-error { color: #c0392b; font-size: 0.82rem; margin-top: 0.4rem; display:none; }

/* FOOTER */
footer { background: #162219; color: rgba(255,255,255,0.5); text-align: center; padding: 2rem 1.5rem; font-size: 0.82rem; }
.ft-brand { font-family: 'Playfair Display', serif; color: var(--cream); font-size: 1.15rem; margin-bottom: 0.3rem; }
.ft-tag { color: var(--gold); letter-spacing: 0.15em; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 0.7rem; }
footer a { color: rgba(201,168,76,0.8); text-decoration: none; margin: 0 0.5rem; }

/* TOAST */
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--green); color: white; padding: 0.72rem 1.4rem; border-radius: 28px; font-size: 0.87rem; z-index: 500; transition: transform 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.22); white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* SHARE TOAST */
.share-toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(120px); background: var(--green); color: white; padding: 0.8rem 1.5rem; border-radius: 12px; font-size: 0.87rem; z-index: 500; transition: transform 0.3s; box-shadow: 0 4px 16px rgba(0,0,0,0.22); text-align:center; }
.share-toast.show { transform: translateX(-50%) translateY(0); }

/* MOBILE RESPONSIVE */
@media(max-width:640px) {
  .nav-link.hide-mobile { display: none; }
  .hero h1 { font-size: 2rem; }
  .hero { padding: 2.5rem 1rem 4rem; }
  .cat-grid { grid-template-columns: 1fr; }
  .products-wrap { padding: 2rem 0.75rem; }
  .cart-panel { width: 100vw; max-width: 100vw; }
  .modal-bg { align-items: flex-end; }
  .modal-box { border-radius: 20px 20px 0 0; max-height: 95vh; max-height: 95dvh; }
  .rev-grid { grid-template-columns: 1fr; }
  .size-btn { min-height: 38px; font-size: 0.82rem; padding: 0.35rem 0.7rem; }
}
@media(min-width:641px) and (max-width:900px) {
  .cat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

// Floating popover
const pop=document.getElementById('infoPopover');
let popTimer=null, popVisible=false;

function showPopover(e,id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p)return;
  document.getElementById('popName').textContent=p.name;
  document.getElementById('popDesc').textContent=p.desc;
  document.getElementById('popBenefits').textContent=p.benefits.split(' · ').map(b=>'• '+b).join('\n');
  positionPopover(e.target);
  clearTimeout(popTimer);
  pop.classList.add('visible');
  popVisible=true;
}
function hidePopover(){
  popTimer=setTimeout(()=>{pop.classList.remove('visible');popVisible=false;},120);
}
function positionPopover(anchor){
  const r=anchor.getBoundingClientRect();
  const pw=280, ph=220; // approx popover size
  const vw=window.innerWidth, vh=window.innerHeight;
  // Try to place above the anchor
  let top=r.top-ph-12;
  let arrowUp=false;
  if(top<8){top=r.bottom+12;arrowUp=true;} // flip below if not enough space above
  pop.classList.toggle('arrow-up',arrowUp);
  // Center horizontally on the anchor icon
  let left=r.left+r.width/2-pw/2;
  if(left<8)left=8;
  if(left+pw>vw-8)left=vw-pw-8;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
}

// Mobile tap to toggle popover
function toggleInfo(e,id){
  e.stopPropagation();
  if(popVisible){hidePopover();pop.classList.remove('visible');popVisible=false;}
  else{showPopover(e,id);}
}
// Tap elsewhere closes popover
document.addEventListener('click',()=>{if(popVisible){pop.classList.remove('visible');popVisible=false;}});

function pickSize(e,id,size){
  e.stopPropagation();
  const p=PRODUCTS.find(x=>x.id===id);
  const card=e.target.closest('.product-card');
  card.dataset.size=size;
  card.querySelectorAll('.size-btn').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById('pr'+id).textContent='$'+p.prices[size]+'.00';
}
function addItem(e,id){
  e.stopPropagation();
  const p=PRODUCTS.find(x=>x.id===id);
  const card=e.target.closest('.product-card');
  const size=card.dataset.size||Object.keys(p.prices)[0];
  const price=p.prices[size];
  const ex=cart.find(i=>i.id===id&&i.size===size);
  if(ex)ex.qty++;else cart.push({id,name:p.name,size,price,qty:1});
  updateCount();
  toast(`Added: ${p.name} (${size})`);
}
function updateCount(){document.getElementById('cartCount').textContent=cart.reduce((s,i)=>s+i.qty,0);}

function getSubtotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}
function getTip(){const s=getSubtotal();if(tipType==='none')return 0;if(tipType==='custom')return Math.max(0,parseFloat(customTip)||0);return Math.round(s*(parseInt(tipType)/100)*100)/100;}
function getTotal(){return getSubtotal()+getTip();}
function getDue(){const t=getTotal();return depOnly?Math.round(t*0.50*100)/100:t;}

function openCart(){document.getElementById('cartBg').classList.add('open');document.getElementById('cartPanel').classList.add('open');renderCart();}
function closeCart(){document.getElementById('cartBg').classList.remove('open');document.getElementById('cartPanel').classList.remove('open');}
function closeModal(){document.getElementById('checkoutBg').classList.remove('open');}

function renderCart(){
  const list=document.getElementById('cartList'),ft=document.getElementById('cartFt');
  if(!cart.length){list.innerHTML='<p style="text-align:center;color:var(--text-light);padding:2.5rem 1rem;font-size:0.9rem;">Your cart is empty</p>';ft.innerHTML='';return;}
  list.innerHTML=cart.map((it,i)=>`
    <div class="c-item">
      <div class="c-item-info">
        <p class="c-item-name">${it.name}</p>
        <p class="c-item-size">${it.size}</p>
        <div class="qty-row">
          <button class="qb" onclick="chQty(${i},-1)">−</button>
          <span class="qn">${it.qty}</span>
          <button class="qb" onclick="chQty(${i},1)">+</button>
          <button class="rb" onclick="rmItem(${i})">✕</button>
        </div>
      </div>
      <span class="c-item-price">$${(it.price*it.qty).toFixed(2)}</span>
    </div>`).join('');
  const sub=getSubtotal(),tip=getTip(),total=getTotal(),due=getDue();
  ft.innerHTML=`
    <div style="margin-bottom:0.65rem">
      <p class="tip-lbl">Add a Tip</p>
      <div class="tip-opts">
        ${['none','10','15','20'].map(t=>`<button class="to${tipType===t?' on':''}" onclick="setTip('${t}')">${t==='none'?'No Tip':t+'%'}</button>`).join('')}
        <button class="to${tipType==='custom'?' on':''}" onclick="setTip('custom')">Custom</button>
      </div>
      ${tipType==='custom'?`<input class="tip-custom" type="number" min="0" step="0.50" placeholder="$0.00" value="${customTip||''}" oninput="setCTip(this.value)">`:''}
    </div>
    <div class="dep-row">
      <div class="dep-info">
        <p class="dep-lbl">Pay deposit only (50%)</p>
        <p class="dep-note">Pay $${(total*0.50).toFixed(2)} now, rest on delivery</p>
      </div>
      <label class="tgl"><input type="checkbox" ${depOnly?'checked':''} onchange="setDep(this.checked)"><span class="tgl-sl"></span></label>
    </div>
    <div class="s-row"><span>Subtotal</span><span>$${sub.toFixed(2)}</span></div>
    ${tip>0?`<div class="s-row"><span>Tip</span><span>$${tip.toFixed(2)}</span></div>`:''}
    ${depOnly?`<div class="s-row" style="color:var(--rose)"><span>Deposit (50%)</span><span>$${due.toFixed(2)}</span></div>`:''}
    <div class="s-row big"><span>${depOnly?'Deposit Due':'Total'}</span><span>$${due.toFixed(2)}</span></div>
    <button class="go-btn" onclick="openCheckout()">Proceed to Checkout →</button>`;
}

function chQty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);updateCount();renderCart();}
function rmItem(i){cart.splice(i,1);updateCount();renderCart();}
function setTip(t){tipType=t;renderCart();}
function setCTip(v){customTip=parseFloat(v)||0;renderCart();}
function setDep(v){depOnly=v;renderCart();}

// --- Checkout: hands the cart to a Netlify Function, which creates a real,
// hosted Square Checkout session and returns a URL. The browser is then
// redirected there. Square's page handles card entry, Apple Pay, and
// Google Pay automatically — no card data ever touches this site. ---

function openCheckout(){
  const sub=getSubtotal(),tip=getTip(),total=getTotal(),due=getDue();
  document.getElementById('modalBody').innerHTML=`
    <div class="f-grp"><label class="f-lbl">Full Name *</label><input class="f-inp" id="cName" placeholder="Your name" autocomplete="name"></div>
    <div class="f-grp"><label class="f-lbl">Email *</label><input class="f-inp" id="cEmail" type="email" placeholder="you@email.com" autocomplete="email"></div>
    <div class="f-grp"><label class="f-lbl">Phone</label><input class="f-inp" id="cPhone" type="tel" placeholder="(555) 000-0000" autocomplete="tel"></div>
    <div class="f-grp"><label class="f-lbl">Notes / Special Requests</label><textarea class="f-inp" id="cNotes" rows="2" placeholder="Allergies, delivery notes, etc."></textarea></div>

    <div class="sum-box">
      <p style="font-weight:600;color:var(--green);margin-bottom:0.5rem;font-family:'Playfair Display',serif;font-size:0.95rem;">Order Summary</p>
      ${cart.map(i=>`<div class="sum-row"><span>${i.name} × ${i.qty} <span style="color:var(--text-light);font-size:0.78rem">(${i.size})</span></span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('')}
      ${tip>0?`<div class="sum-row"><span>Tip</span><span>$${tip.toFixed(2)}</span></div>`:''}
      ${depOnly?`<div class="sum-row" style="color:var(--rose)"><span>Deposit (50%)</span><span>$${due.toFixed(2)}</span></div>`:''}
      <div class="sum-total"><span>${depOnly?'Amount Due Now':'Total'}</span><span>$${due.toFixed(2)}</span></div>
    </div>
    <p class="pay-error" id="checkout-error"></p>
    <button class="card-pay-btn" id="goToCheckoutBtn" onclick="placeOrder()">🔒 Continue to Secure Checkout — $${due.toFixed(2)}</button>
    <p style="text-align:center;color:var(--text-light);font-size:0.75rem;margin-top:0.6rem;">You'll enter payment details on Square's secure checkout page, including Apple Pay and Google Pay if available.</p>`;
  document.getElementById('checkoutBg').classList.add('open');
}

async function placeOrder(){
  const name=document.getElementById('cName').value.trim();
  const email=document.getElementById('cEmail').value.trim();
  const errEl=document.getElementById('checkout-error');
  if(errEl)errEl.style.display='none';
  if(!name||!email){toast('Please enter your name and email');return;}

  const btn=document.getElementById('goToCheckoutBtn');
  btn.disabled=true; btn.textContent='Preparing secure checkout…';

  const payload={
    items:cart,
    tip:getTip(),
    depositOnly:depOnly,
    customer:{
      name,email,
      phone:(document.getElementById('cPhone')?.value||'').trim(),
      notes:(document.getElementById('cNotes')?.value||'').trim()
    }
  };

  try{
    const res=await fetch('/.netlify/functions/create-checkout',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    const data=await res.json();
    if(!res.ok||!data.checkoutUrl){
      throw new Error(data.error||'Could not start checkout');
    }
    // Save a local record of the attempt for your own reference (not proof of payment)
    const orders=JSON.parse(localStorage.getItem('ue_orders')||'[]');
    orders.push({id:Date.now().toString(),timestamp:new Date().toISOString(),customer:payload.customer,items:JSON.parse(JSON.stringify(cart)),subtotal:getSubtotal(),tip:getTip(),depositOnly:depOnly,total:+getTotal().toFixed(2),status:'redirected_to_checkout'});
    localStorage.setItem('ue_orders',JSON.stringify(orders));
    // Send the customer to Square's hosted, secure checkout page
    window.location.href=data.checkoutUrl;
  }catch(e){
    btn.disabled=false; btn.textContent='🔒 Continue to Secure Checkout';
    const msg='Something went wrong starting checkout. Please try again in a moment.';
    if(errEl){errEl.textContent=msg;errEl.style.display='block';} else toast(msg);
    console.error(e);
  }
}

// Reviews
function renderReviews(){
  const revs=JSON.parse(localStorage.getItem('ue_comments')||'[]').slice().reverse();
  const g=document.getElementById('revGrid');
  if(!revs.length){g.innerHTML='<p style="color:rgba(255,255,255,0.48);font-size:0.88rem;font-style:italic;">No reviews yet — be the first!</p>';return;}
  g.innerHTML=revs.map(r=>`<div class="rev-card"><p class="rev-stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</p><p class="rev-text">"${r.comment}"</p><p class="rev-name">${r.name}</p><p class="rev-date">${new Date(r.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</p></div>`).join('');
}
function setRating(n){selRating=n;document.querySelectorAll('.star-b').forEach((b,i)=>b.classList.toggle('on',i<n));}
function submitReview(){
  const name=document.getElementById('rName').value.trim();
  const text=document.getElementById('rText').value.trim();
  if(!name||!text||!selRating){toast('Please add your name, a star rating, and your review');return;}
  const revs=JSON.parse(localStorage.getItem('ue_comments')||'[]');
  revs.push({id:Date.now().toString(),name,rating:selRating,comment:text,timestamp:new Date().toISOString()});
  localStorage.setItem('ue_comments',JSON.stringify(revs));
  document.getElementById('rName').value='';document.getElementById('rText').value='';
  selRating=0;document.querySelectorAll('.star-b').forEach(b=>b.classList.remove('on'));
  renderReviews();toast('Review posted — thank you!');
}

// Share
function sharesite(){
  const data={title:'Unique Essentials',text:'Natural herbal drinks & wellness tonics — Wellness & Balance, By Design',url:window.location.href};
  if(navigator.share){navigator.share(data).catch(()=>{});}
  else{navigator.clipboard.writeText(window.location.href).then(()=>toast('Link copied to clipboard!')).catch(()=>toast('Copy this link: '+window.location.href));}
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

renderReviews();updateCount();
</script>
